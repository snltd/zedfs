name: Rust Tests
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/*.rs"
      - .github/workflows/rust-tests.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/*.rs"
      - .github/workflows/rust-tests.yml

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: test-rust
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust Tests
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Set up caching
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up cargo-nextest
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: nextest
      - name: Do a Clippy
        run: cargo clippy
      - name: Run Rust Tests
        run: cargo test -- --include-ignored --nocapture
