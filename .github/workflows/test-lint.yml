name: Lint Tests
permissions:
  contents: read
on: 
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-lint
  cancel-in-progress: true

jobs:
  typo-checks:
    name: Typo Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Check for Typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # 1.50.1
